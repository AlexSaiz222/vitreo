# Serves the production build of the PWA (apps/web/dist) on 127.0.0.1:8080.
# Tailscale publishes it over HTTPS inside the tailnet (docs/05).
server {
  listen 80;
  root /usr/share/nginx/html;

  # PWA files must never be cached stale: the service worker updates the app.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri /index.html;
  }

  # The hub's API (A4, D87). Resolved per request, so nginx starts and keeps
  # serving the app while the hub is down; the app then gets a 502 and says
  # so calmly (docs/03).
  # The journal's photos (A8, D93): sent from the phone (~300 KB, at most
  # 1.5 MB, checked again by the hub) and served cacheable, since a photo
  # never changes.
  location ~ ^/api/v1/journal/[^/]+/photo$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $hub http://hub:8787;
    proxy_pass $hub;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $hub http://hub:8787;
    proxy_pass $hub;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
  }
}
