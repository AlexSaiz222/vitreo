# Vitreo · Mosquitto 2

persistence true
persistence_location /mosquitto/data/
# Persistent sessions (the hub's, D87) and their queued messages survive a
# broker restart: saved every minute and on a clean stop.
autosave_interval 60
# Room for several days without the hub (telemetry every 30 s, more while
# watering); beyond this the newest messages are dropped (D87).
max_queued_messages 20000
max_inflight_messages 20

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Authentication applies to every listener.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# MQTT: ESP32, hub, simulator
listener 1883
protocol mqtt

# MQTT over WebSocket: web app
listener 9001
protocol websockets
